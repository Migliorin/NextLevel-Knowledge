services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    secrets:
      - postgres_root_user
      - postgres_root_password
    environment:
      POSTGRES_USER_FILE: /run/secrets/postgres_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_net

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    secrets:
      - minio_root_user
      - minio_root_password
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    volumes:
      - minio_data:/data
    networks:
      - app_net

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "/usr/local/bin/init-minio.sh"]
    secrets:
      - minio_root_user
      - minio_root_password
      - minio_backend_access_key
      - minio_backend_secret_key
      - minio_ai_access_key
      - minio_ai_secret_key
    volumes:
      - ./documents-backend-policy.json:/tmp/documents-backend-policy.json:ro
      - ./documents-ai-reader-policy.json:/tmp/documents-ai-reader-policy.json:ro
      - ./init-minio.sh:/usr/local/bin/init-minio.sh:ro
    networks:
      - app_net

volumes:
  postgres_data:
  minio_data:

secrets:
  minio_root_user:
    file: ./secrets/minio_root_user.txt
  minio_root_password:
    file: ./secrets/minio_root_password.txt
  minio_backend_access_key:
    file: ./secrets/minio_backend_access_key.txt
  minio_backend_secret_key:
    file: ./secrets/minio_backend_secret_key.txt
  minio_ai_access_key:
    file: ./secrets/minio_ai_access_key.txt
  minio_ai_secret_key:
    file: ./secrets/minio_ai_secret_key.txt
  postgres_root_user:
    file: ./secrets/postgres_root_user.txt
  postgres_root_password:
    file: ./secrets/postgres_root_password.txt

networks:
  app_net:
    driver: bridge
